[project]
name = "restaurant-ordering-assistant"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow_ui'"
markers = [
    "live: requires a valid GOOGLE_API_KEY and network; skipped by default",
    "slow_ui: full UI integration test; skipped in fast CI",
]
filterwarnings = [
    # The google.generativeai SDK is deprecated upstream; migrating to
    # google-genai is tracked separately - don't fail tests over it.
    "ignore::DeprecationWarning:google.*",
    "ignore:.*google.generativeai.*:UserWarning",
]

[tool.coverage.run]
source = ["core", "workers", "scripts"]
omit = ["venv/*", ".venv/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
# Pragmatic starting set: pyflakes, pycodestyle errors/warnings subset.
select = ["E4", "E7", "E9", "F"]
